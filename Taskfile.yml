# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BIN_DIR: bin
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  BIN: '{{.BIN_DIR}}/search-engine{{.EXE}}'
  GO_FLAGS: '-trimpath'
  MAIN: ./cmd

tasks:
  default:
    desc: Run verify pipeline (format check, vet, tests)
    cmds:
      - task: check

  check:
    desc: Format check, vet, and test (use before commit or in CI)
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  ci:
    desc: Full CI-style run including race detector and coverage
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:race
      - task: test:cover

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  verify:
    desc: Verify module dependencies checksums
    cmds:
      - go mod verify

  download:
    desc: Download modules (prefetch deps)
    cmds:
      - go mod download

  build:
    desc: Build the search-engine binary into bin/
    cmds:
      - cmd: mkdir -p {{.BIN_DIR}}
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - go build {{.GO_FLAGS}} -o {{.BIN}} {{.MAIN}}

  run:
    desc: Run app with extra CLI args (e.g. task run -- -serve)
    cmds:
      - go run {{.MAIN}} {{.CLI_ARGS}}

  run:crawl:
    desc: Run crawler (-crawl)
    cmds:
      - go run {{.MAIN}} -crawl

  run:index:
    desc: Build index from crawled pages (-index)
    cmds:
      - go run {{.MAIN}} -index

  run:serve:
    desc: Start HTTP API (-serve)
    cmds:
      - go run {{.MAIN}} -serve

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:v:
    desc: Run tests verbose
    cmds:
      - go test -v ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with coverage summary per package
    cmds:
      - go test -cover ./...

  test:cover:out:
    desc: Write coverage profile to coverage.out
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  bench:
    desc: Run benchmarks (if any)
    cmds:
      - go test -bench=. -benchmem ./...

  fmt:
    desc: Format all Go sources (gofmt)
    cmds:
      - go fmt ./...

  fmt:check:
    desc: Fail if any file is not gofmt'd (per-OS)
    cmds:
      - cmd: test -z "$(gofmt -l -e .)"
        platforms: [linux, darwin]
      - cmd: cmd /c "gofmt -l -e . | findstr /R /C:\".\" >nul && exit /b 1 || exit /b 0"
        platforms: [windows]

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  generate:
    desc: Run go generate (if you add //go:generate directives)
    cmds:
      - go generate ./...

  lint:
    desc: Run golangci-lint (install from https://golangci-lint.run/ if missing)
    cmds:
      - golangci-lint run ./...

  clean:
    desc: Remove bin/ and coverage.out
    cmds:
      - cmd: rm -rf {{.BIN_DIR}} coverage.out
        platforms: [linux, darwin]
      - cmd: cmd /c "if exist {{.BIN_DIR}} rmdir /s /q {{.BIN_DIR}} & if exist coverage.out del /f /q coverage.out & exit /b 0"
        platforms: [windows]
